<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>itch.io screenshot capture</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; background: #111827; }
    </style>
  </head>
  <body>
    <iframe id="game" title="Elemental Shogi"></iframe>
    <script>
      const params=new URLSearchParams(location.search),view=params.get("view")||"ja";
      localStorage.setItem("attributeShogiLanguage",view==="en"?"en":"ja");
      localStorage.setItem("attributeShogiGameMode",view==="local-menu"?"local":"cpu");
      if(view==="tutorial")localStorage.removeItem("attributeShogiTutorialSeen");
      else localStorage.setItem("attributeShogiTutorialSeen","yes");
      localStorage.removeItem("attributeShogiSavedGame");
      const frame=document.getElementById("game");
      frame.src="../index.html";
      frame.addEventListener("load",()=>{
        if(view==="menu"||view==="local-menu"){
          setTimeout(()=>frame.contentDocument.getElementById("open-menu")?.click(),1200);
          setTimeout(()=>frame.contentDocument.getElementById("save-game")?.click(),1800);
        }
      });
    </script>
  </body>
</html>

          state.board[5][4]=piece('pawn','white');state.board[4][4]=piece('rook','black');state.board[5][4].attr='water';state.board[4][4].attr='wind';
          const usefulSacrifice={kind:'board',fromX:4,fromY:5,x:4,y:4,result:'retaliation'},usefulScore=retaliationTradeScore(usefulSacrifice,'white');
          state.board[5][4]=piece('gold','white');state.board[4][4]=piece('pawn','black');state.board[5][4].attr='water';state.board[4][4].attr='wind';
          const wastefulScore=retaliationTradeScore(usefulSacrifice,'white');
          check('むずかしいCPUは駒損と戦略的な返り討ちを評価',exposedLoss===PIECES.gold.value&&usefulScore>0&&wastefulScore<0,String(exposedLoss)+'/'+String(usefulScore)+'/'+String(wastefulScore));
          state.clashes=[{x:2,y:2,attr:'wind',pieces:[],support:[{x:2,y:3}],startedAt:0,expiresAt:2}];state.ply=1;
          const helper=piece('gold','white');helper.attr='fire';helper.boardSince=0;state.board[4][2]=helper;
          check('むずかしいCPUは期限間近の援軍を加点',hardTacticalScore({kind:'board',fromX:2,fromY:4,x:2,y:3,result:'support'},'white')>=3000);
          state=initialState();
          check('初期局面を終局扱いしない',resolveNoLegalMoves()===false&&state.winner===null);
          return checks;
        })()`);
      }catch(error){report=[{name:'テスト実行',pass:false,detail:error.stack||String(error)}]}
      const list=document.getElementById('results');
      report.forEach(item=>{const li=document.createElement('li');li.className=item.pass?'pass':'fail';li.textContent=`${item.pass?'✓':'✗'} ${item.name}${item.detail?' — '+item.detail:''}`;list.appendChild(li)});
      const passed=report.filter(x=>x.pass).length;
      document.getElementById('summary').textContent=`${passed}/${report.length} 件成功`;
    }
  </script>

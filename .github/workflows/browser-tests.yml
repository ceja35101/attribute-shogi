name: Browser tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/attribute-shogi-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.25
          done
          exit 1
      - name: Install browser test driver
        run: npm install --no-save playwright-core
      - name: Run browser regression tests
        run: node tests/run-browser-test.mjs regression
      - name: Run durability test
        run: node tests/run-browser-test.mjs durability
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            regression.html
            regression.png
            durability.html
            durability.png
            /tmp/attribute-shogi-server.log

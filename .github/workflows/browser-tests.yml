name: Browser tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source and store assets
        run: python3 tools/validate-release.py
      - name: Build itch.io HTML package
        shell: pwsh
        run: ./tools/build-itch.ps1
      - name: Validate itch.io package entry point
        run: python3 tools/validate-release.py --archive
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/attribute-shogi-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.25
          done
          exit 1
      - name: Install browser test driver
        run: npm install --no-save playwright-core
      - name: Run browser regression tests
        run: node tests/run-browser-test.mjs regression
      - name: Run online invite-room smoke test
        run: node tests/run-online-smoke.mjs
      - name: Run durability test
        run: node tests/run-browser-test.mjs durability
      - name: Run 500 CPU self-play games
        run: node tests/run-browser-test.mjs selfplay
      - name: Upload itch.io package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: attribute-shogi-itch-package
          path: dist/*-itch.zip
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            regression.html
            regression.png
            durability.html
            durability.png
            selfplay.html
            selfplay.png
            /tmp/attribute-shogi-server.log

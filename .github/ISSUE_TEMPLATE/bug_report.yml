name: 不具合報告
description: 対局、表示、保存、端末固有の問題を報告します
title: "[不具合] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 発生した問題
      description: 期待した動作と実際の動作を記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: "1. 駒を選択\n2. …"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 端末・OS・ブラウザー
      placeholder: "iPhone 12 Pro / iOS xx / Safari"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 診断情報・棋譜
      description: 歯車メニューの「診断情報をコピー」または棋譜を貼り付けてください。個人情報は含めないでください。
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: 画像・補足
